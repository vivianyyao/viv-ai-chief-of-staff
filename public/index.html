<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <title>viv · your ai chief of staff</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="identity">
        <div class="avatar" aria-hidden="true">v</div>
        <div>
          <h1>viv</h1>
          <p>your ai chief of staff</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="presence"><i></i><span>available</span></div>
        <button id="developer-toggle" class="developer-toggle" type="button" aria-label="open developer tools" title="developer tools">•••</button>
      </div>
    </header>

    <section id="conversation" class="conversation" aria-live="polite" aria-label="conversation with viv">
      <div class="day-divider"><span>today</span></div>
    </section>

    <p id="error" class="error" role="alert" hidden></p>

    <form id="chat-form" class="composer-wrap">
      <label class="sr-only" for="message">message viv</label>
      <div class="composer">
        <textarea id="message" rows="1" placeholder="text viv..." autocomplete="off" spellcheck="true"></textarea>
        <button id="send-button" type="submit" aria-label="send message">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 6l4 4-4 4"/></svg>
        </button>
      </div>
      <p class="local-note">private · remembered on this browser</p>
    </form>
  </main>

  <dialog id="developer-panel" class="developer-panel">
    <div class="developer-heading">
      <div><span>development</span><h2>viv’s working state</h2></div>
      <button id="developer-close" type="button" aria-label="close developer tools">×</button>
    </div>
    <dl class="developer-summary">
      <div><dt>last intent</dt><dd id="dev-intent">none yet</dd></div>
      <div><dt>pending</dt><dd id="dev-pending">nothing pending</dd></div>
      <div><dt>calendar source</dt><dd id="dev-calendar-source">checking</dd></div>
    </dl>
    <section><h3>known tasks</h3><pre id="dev-tasks">[]</pre></section>
    <section><h3>schedule context</h3><pre id="dev-schedule">[]</pre></section>
    <section><h3>recent state</h3><pre id="dev-state">{}</pre></section>
    <button id="reset-conversation" class="reset-button" type="button">reset local conversation</button>
    <p class="shortcut-note">shortcut: command/control + shift + d</p>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
