<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e9">
  <title>viv · your ai chief of staff</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="chat-header">
      <div class="identity">
        <div class="avatar" aria-hidden="true">v</div>
        <div><h1>viv</h1><p>your ai chief of staff</p></div>
      </div>
      <div class="presence"><i></i><span>local</span></div>
    </header>

    <section id="conversation" class="conversation" aria-live="polite" aria-label="Conversation with Viv">
      <div class="day-divider"><span>today</span></div>
      <article class="message-row viv-row intro-message">
        <div class="message viv-message">
          <p>hi. what’s taking up space?</p>
          <p>send me a task, a loose end, or just how you’re feeling.</p>
        </div>
      </article>
    </section>

    <p id="error" class="error" role="alert" hidden></p>

    <form id="chat-form" class="composer-wrap">
      <label class="sr-only" for="message">message viv</label>
      <div class="composer">
        <textarea id="message" rows="1" placeholder="text what’s on your mind…" autocomplete="off" spellcheck="true"></textarea>
        <button id="send-button" type="submit" aria-label="send message">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 6l4 4-4 4"/></svg>
        </button>
      </div>
      <p class="local-note">private local preview · nothing will be changed</p>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
